version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: surveillance_postgres
    restart: always
    environment:
      POSTGRES_USER: surveillance_user
      POSTGRES_PASSWORD: surveillance_pass
      POSTGRES_DB: market_surveillance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveillance_user -d market_surveillance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: surveillance_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: surveillance_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://surveillance_user:surveillance_pass@postgres:5432/market_surveillance_db
      USE_SQLITE_FALLBACK: "False"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "False"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: surveillance_celery_worker
    restart: always
    command: celery -A backend.tasks.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://surveillance_user:surveillance_pass@postgres:5432/market_surveillance_db
      USE_SQLITE_FALLBACK: "False"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: surveillance_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
